\* Two workers, two concurrent /complete calls, an admin sending two requests, a classify
\* request past the threshold, up to two jobs, retries included, and two attempts per training.
\* check.sh derives the other runs (the code before the fixes; workers that die) from this file.
CONSTANTS
    Workers = {w1, w2}
    Handlers = {h1, h2}
    Admins = {a1}
    Clients = {c1}
    MaxJobs = 2
    MaxAttempts = 2
    AdminOps = 2
    Fixed = TRUE
    WorkerCrash = FALSE
    LostCalls = 1
    defaultInitValue = defaultInitValue

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AtMostOneOpenJob
    ClaimedOnce
    ServedIsDone
    CancelledNeverDeploys
    ThresholdOnlyWhileCollecting
    MemoryMatchesDb
    StatusHasJob
    RetriesFollowWorkerFailures
    CancelledNeverRetried
    AdminRetriesFollowCancels
    AttemptsBounded
    RetriedUntilTheLastAttempt

PROPERTIES
    FinishedJobsStay
    ClaimedJobsFinish
    QueuedJobsLeaveTheQueue
    LockReleased
