name: CI

# Every push and pull request: Rust checks (cargo fmt, clippy with its pedantic lints, the tests),
# Python lint (ruff's rules and formatting, ty's types), Python unit tests, the tiny end-to-end run
# (Rust gateway + Python worker on synthetic traffic, a few minutes) and the TLA+ models in
# verification/ (TLC, about eight minutes); `make lint test test-tiny verify` runs the same locally
# (make lint also runs bandit, as the Security workflow does). The medium and big end-to-end runs
# on 3,928 real texts are Makefile targets for your own machine (make test-medium, make test-big),
# not jobs here.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commits (Dependabot keeps them current); the token can only read.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  video:
    name: Video
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
      # Check the HTML player and the soundtrack assembly; MP4 export is optional.
      # Chrome is preinstalled on ubuntu-latest.
      - run: npm run check

  rust:
    name: Gateway (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: gateway
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: ONNX Runtime library (from the Python wheel uv.lock pins)
        working-directory: .
        run: |
          uv export --locked --all-extras --no-emit-project --no-hashes -o "$RUNNER_TEMP/constraints.txt"
          pip install onnxruntime -c "$RUNNER_TEMP/constraints.txt"
          python - >> "$GITHUB_ENV" <<'PY'
          import glob, os, onnxruntime
          print("ORT_DYLIB_PATH=" + sorted(glob.glob(os.path.join(os.path.dirname(onnxruntime.__file__), "capi", "libonnxruntime.so*")))[0])
          PY
      - run: cargo fmt --check
      # Clippy's pedantic lints too: gateway/Cargo.toml's [lints] turns them on (and allows the
      # few that don't fit), so make lint and any other cargo clippy run the same ones.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # ruff and ty are the versions pyproject.toml's lint extra pins, which make lint runs too. ty
  # resolves imports against the installed packages, so this installs what the unit tests do.
  lint:
    name: Python lint (ruff, ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uv.lock
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # The versions uv.lock pins (--locked also fails when it is out of date), as make installs
      # them: PyTorch's CPU build first, without its dependencies, then everything else from PyPI.
      - name: Install (CPU PyTorch)
        run: |
          uv export --locked --all-extras --no-emit-project --no-hashes -o "$RUNNER_TEMP/constraints.txt"
          pip install --no-deps torch -c "$RUNNER_TEMP/constraints.txt" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" -c "$RUNNER_TEMP/constraints.txt"
      - run: ruff check
      - run: ruff format --check
      - run: ty check --python "$(command -v python)"

  python:
    name: Python (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uv.lock
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # The versions uv.lock pins (--locked also fails when it is out of date), as make installs
      # them: PyTorch's CPU build first, without its dependencies, then everything else from PyPI.
      - name: Install (CPU PyTorch)
        run: |
          uv export --locked --all-extras --no-emit-project --no-hashes -o "$RUNNER_TEMP/constraints.txt"
          pip install --no-deps torch -c "$RUNNER_TEMP/constraints.txt" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" -c "$RUNNER_TEMP/constraints.txt"
      - run: pytest -m "not slow and not gateway"

  e2e-tiny:
    name: End to end, tiny (gateway + worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: gateway
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uv.lock
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # The versions uv.lock pins (--locked also fails when it is out of date), as make installs
      # them: PyTorch's CPU build first, without its dependencies, then everything else from PyPI.
      - name: Install (CPU PyTorch)
        run: |
          uv export --locked --all-extras --no-emit-project --no-hashes -o "$RUNNER_TEMP/constraints.txt"
          pip install --no-deps torch -c "$RUNNER_TEMP/constraints.txt" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" -c "$RUNNER_TEMP/constraints.txt"
      - name: Build the gateway
        run: cargo build --release --locked --manifest-path gateway/Cargo.toml
      - name: Gateway + worker end to end
        run: pytest -m gateway -v
        env:
          SN_GATEWAY_BIN: gateway/target/release/system-none-gateway

  # Every property holds for the code as it is, and each bug the models found still shows up in
  # the model of the code before its fix (see verification/README.md).
  tlc:
    name: TLA+ models (TLC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: TLC (tla2tools.jar 1.7.4, pinned by checksum; the runner has Java)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
      - run: TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar" bash verification/check.sh
      - run: TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar" bash verification/check.sh --original
