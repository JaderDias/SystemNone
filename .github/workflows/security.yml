name: Security

# Every push and pull request, and every Monday (advisories appear without any change here):
#   cargo audit  known vulnerabilities in the gateway's locked Rust dependencies (RustSec)
#   pip-audit    known vulnerabilities in the Python dependencies uv.lock pins, every extra's
#   bandit       static analysis of the Python code: the package and its tests
#   zizmor       these workflows: injection, token permissions, unpinned actions
#   gitleaks     secrets in any commit of the branch, redacted in the log
# CodeQL and dependency review need GitHub Advanced Security on a private repository.
on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Rust advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: gateway

  pip-audit:
    name: Python advisories (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      # What uv.lock pins, with hashes, for every platform (--locked: it must be up to date).
      - run: uv export --locked --all-extras --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
      - run: uvx pip-audit --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  bandit:
    name: Python static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      # Medium and high severity fail the job; pyproject.toml lists the skipped checks and why
      # (B101, assert, only in tests/). The version is the one pyproject.toml's lint extra pins,
      # which make lint runs.
      - run: uvx --from "bandit[toml]==1.9.4" bandit -c pyproject.toml -r src tests -ll

  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - run: uvx zizmor --format github .
        env:
          GH_TOKEN: ${{ github.token }}

  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The release's Linux binary, checked against the SHA-256 its checksums file lists; change
      # both together.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # Every commit, not just the last: a secret removed later is still in the history. What it
      # finds shows with the secret redacted; .gitleaksignore lists the findings that aren't secrets.
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .'
