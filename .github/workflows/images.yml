name: Images

# Builds the gateway and worker images with Nix, checks that rebuilding them gives the same bytes
# and that Docker Compose runs them, then, on main, publishes them to GitHub's container registry,
# where docker-compose.yaml pulls them from.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commits (Dependabot keeps them current); the token can only read,
# except for publishing packages.
permissions:
  contents: read

jobs:
  images:
    name: Build, check and publish the images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Free disk space (the worker image holds PyTorch)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        run: nix build --print-build-logs .#gateway-image .#worker-image
      - name: Rebuilding gives the same bytes
        run: nix build --rebuild .#gateway .#system-none .#gateway-image .#worker-image
      - name: Start with Docker Compose
        run: |
          printf 'SN_ADMIN_TOKEN=ci-admin\nSN_WORKER_TOKEN=ci-worker\n' > .env
          nix run .#compose  # loads this build under the names docker-compose.yaml pulls
          docker compose up -d --pull never
          for i in $(seq 60); do curl -sf localhost:8080/health && break; sleep 2; done
      - name: Check
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code -X POST -H 'Authorization: Bearer ci-worker' localhost:8080/internal/jobs/claim)" = 204
          test "$(code -H 'Authorization: Bearer ci-worker' localhost:8080/admin/api/state)" = 401
          test "$(code -H 'Authorization: Bearer ci-admin' localhost:8080/admin/api/state)" = 200
          sleep 30  # the worker polls every 15 s; a crash would show up as a restart
          for service in gateway worker; do
            state=$(docker inspect -f '{{.State.Running}} {{.RestartCount}} {{.Config.User}}' "$(docker compose ps -q $service)")
            echo "$service: $state"
            test "$state" = "true 0 65534:65534"
          done
      - name: Logs
        if: always()
        run: docker compose logs
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: REGISTRY_USER="$GITHUB_ACTOR" nix run .#publish-images -- latest "sha-$GITHUB_SHA"
