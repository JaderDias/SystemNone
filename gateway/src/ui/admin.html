<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · SystemNone</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
/* ---- Design system: shared with index.html ------------------------------------------------- */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f3f4f6; --border: #e5e7eb; --border-strong: #d1d5db;
  --text: #111827; --text-2: #4b5563; --text-3: #6b7280;
  --accent: #4f46e5; --accent-soft: #eef2ff; --on-accent: #ffffff;
  --ok: #047857; --ok-soft: #ecfdf5; --warn: #b45309; --warn-soft: #fffbeb;
  --bad: #b91c1c; --bad-soft: #fef2f2; --info: #1d4ed8; --info-soft: #eff6ff;
  --student: #10b981; --s1: #cbd5e1;
  --radius: 10px; --shadow: 0 1px 2px rgba(16, 24, 40, .05);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0f17; --surface: #121826; --surface-2: #1a2131; --border: #263042; --border-strong: #354156;
    --text: #e5e7eb; --text-2: #b4bccb; --text-3: #8b95a7;
    --accent: #818cf8; --accent-soft: rgba(129, 140, 248, .14); --on-accent: #0b0f17;
    --ok: #34d399; --ok-soft: rgba(52, 211, 153, .12); --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, .12);
    --bad: #f87171; --bad-soft: rgba(248, 113, 113, .12); --info: #60a5fa; --info-soft: rgba(96, 165, 250, .12);
    --student: #34d399; --s1: #475569; --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.topbar-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 28px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; color: var(--text); white-space: nowrap; }
.brand img { display: block; }
.nav { display: flex; gap: 4px; height: 100%; }
.nav a { display: flex; align-items: center; padding: 0 12px; color: var(--text-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.nav a:hover { color: var(--text); text-decoration: none; }
.nav a.on { color: var(--text); border-bottom-color: var(--accent); }
.topbar .meta { margin-left: auto; color: var(--text-3); font-size: 12.5px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.page { max-width: 1200px; margin: 0 auto; padding: 28px 24px 72px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { font-size: 22px; line-height: 1.25; margin: 0; letter-spacing: -.02em; font-weight: 650; }
.page-head p { margin: 4px 0 0; color: var(--text-2); }
h2 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -.005em; }
h3 { font-size: 13px; margin: 0 0 10px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
.muted { color: var(--text-3); }
.small { font-size: 12.5px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.panel-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.panel-body { padding: 18px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }
.kpi { padding: 16px 18px; }
.kpi .label { color: var(--text-3); font-size: 12.5px; font-weight: 500; }
.kpi .value { font-size: 24px; font-weight: 650; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .sub { color: var(--text-3); font-size: 12px; margin-top: 2px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface-2); }
td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child > td { border-bottom: 0; }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 12px; font-weight: 550; white-space: nowrap; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.badge.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.indeterminate > i { width: 35%; animation: slide 1.6s ease-in-out infinite alternate; }
@keyframes slide { from { transform: translateX(-10%); } to { transform: translateX(200%); } }
@media (prefers-reduced-motion: reduce) { .bar.indeterminate > i { animation: none; } }
.empty { padding: 48px 24px; text-align: center; color: var(--text-3); }
.gate { max-width: 400px; margin: 72px auto; }
input, select, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); color: var(--text); width: 100%; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible, .row-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 550; font-size: 13px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; }
button:hover { background: var(--surface-2); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button.primary:hover { filter: brightness(1.06); }
details > summary { cursor: pointer; color: var(--text-2); font-weight: 550; list-style: none; display: flex; align-items: center; gap: 8px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "›"; display: inline-block; width: 10px; transition: transform .15s; color: var(--text-3); font-size: 16px; line-height: 1; }
details[open] > summary::before { transform: rotate(90deg); }
@media (max-width: 640px) {
  .topbar-inner { padding: 0 16px; gap: 12px; }
  .topbar .meta { display: none; }
  .nav a { padding: 0 8px; }
  .page { padding: 20px 16px 56px; }
  .hide-sm { display: none; }
  td, th { padding: 12px 10px; }
}
@media (max-width: 420px) {
  .brand { font-size: 0; gap: 0; }
}

/* ---- Settings ------------------------------------------------------------------------------- */
.layout { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 28px; align-items: start; }
.toc { position: sticky; top: 80px; display: grid; gap: 2px; }
.toc a { color: var(--text-2); padding: 6px 10px; border-radius: 6px; font-weight: 500; }
.toc a:hover { background: var(--surface); text-decoration: none; color: var(--text); }
.sections { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; min-width: 0; }
.section-head { margin-bottom: 12px; }
.section-head h2 { font-size: 17px; }
.section-head p { margin: 4px 0 0; color: var(--text-2); max-width: 760px; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 16px; }
label.field { display: grid; gap: 5px; font-size: 13px; color: var(--text-2); font-weight: 500; align-content: start; }
label.field .help { font-weight: 400; color: var(--text-3); font-size: 12px; }
label.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--text); }
label.check input { width: 16px; height: 16px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
label.check .help { display: block; color: var(--text-3); font-size: 12px; }
textarea { font-family: var(--mono); font-size: 12.5px; min-height: 76px; resize: vertical; }
input:disabled { opacity: .55; }
fieldset { border: 0; padding: 0; margin: 0; }
fieldset + fieldset { border-top: 1px solid var(--border); padding-top: 18px; margin-top: 18px; }
legend { font-weight: 650; padding: 0; margin-bottom: 4px; }
fieldset > p { margin: 0 0 12px; color: var(--text-3); font-size: 12.5px; max-width: 760px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.panel-foot { padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--radius) var(--radius); }
button.danger { color: var(--bad); }
button.danger:hover { background: var(--bad-soft); }
button:disabled { opacity: .5; cursor: default; }
.prompt-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
.data-box code { overflow-wrap: anywhere; }
.data-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--text-2); }
.data-box b { color: var(--text); }
.data-box p { margin: 6px 0 0; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
.kv span:first-child { color: var(--text-3); }
.kv span:last-child { font-variant-numeric: tabular-nums; text-align: right; }
.message { max-width: 420px; overflow-wrap: anywhere; color: var(--text-2); font-size: 13px; }
details.form { border-top: 1px solid var(--border); padding: 14px 18px; }
details.form[open] > summary { margin-bottom: 14px; }
.hint-list { margin: 8px 0 0; padding-left: 18px; color: var(--text-3); font-size: 12.5px; }
.hint-list li { margin: 3px 0; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 8px; background: var(--text); color: var(--bg); font-size: 13.5px; display: none; max-width: min(560px, 92vw); box-shadow: 0 8px 24px rgba(0, 0, 0, .18); z-index: 20; }
#toast.err { background: var(--bad); color: #fff; }
@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .toc { position: static; display: flex; flex-wrap: wrap; }
  .prompt-grid { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="/"><img src="/favicon.svg" width="24" height="24" alt="" aria-hidden="true">SystemNone</a>
  <nav class="nav" aria-label="Main"><a href="/">Overview</a><a href="/jobs">Training</a><a class="on" href="/admin">Settings</a></nav>
  <span class="meta" id="storeinfo"></span>
</div></header>
<main class="page" id="main">
  <section class="panel gate"><div class="panel-body">
    <h2>Admin token</h2>
    <p class="muted">Use the <code>SN_ADMIN_TOKEN</code> the gateway was started with. <code>make</code> writes one to <code>.env</code>, which Docker Compose reads too.</p>
    <input id="tok" type="password" placeholder="Token" autocomplete="off" aria-label="Admin token">
    <div style="margin-top:12px"><button class="primary" id="unlock">Unlock</button></div>
  </div></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="base-models">
  <option value="jhu-clsp/ettin-encoder-17m">Ettin 17M (default)</option>
  <option value="jhu-clsp/ettin-encoder-32m">Ettin 32M</option>
  <option value="jhu-clsp/ettin-encoder-150m">Ettin 150M</option>
  <option value="google/embeddinggemma-300m">frozen, only a head is trained: few labels, no GPU (gated)</option>
  <option value="microsoft/mdeberta-v3-base">multilingual, 86M + 190M embeddings</option>
  <option value="microsoft/deberta-v3-small">English, 44M</option>
  <option value="microsoft/deberta-v3-base">English, 86M</option>
  <option value="FacebookAI/xlm-roberta-base">multilingual</option>
  <option value="answerdotai/ModernBERT-base">English, long inputs</option>
  <option value="jhu-clsp/mmBERT-base">multilingual, 110 languages</option>
</datalist>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = (n) => Number(n || 0).toLocaleString();
const pct = (x, digits = 0) => x == null || !Number.isFinite(Number(x)) ? "—" : `${(Number(x) * 100).toFixed(digits)}%`;
// TypeSafe Jev's list price, every System One model's until changed: $42 per billion input tokens, output free.
const JEV_PRICING = {usd_per_call: 0, usd_per_million_input_tokens: 0.042, usd_per_million_output_tokens: 0};
function priceText(pr) {
  pr = pr || JEV_PRICING;
  const parts = [[pr.usd_per_call, "/call"], [pr.usd_per_million_input_tokens, "/M in"], [pr.usd_per_million_output_tokens, "/M out"]]
    .filter(([x]) => x > 0).map(([x, unit]) => `$${x}${unit}`);
  return parts.length ? parts.join(" + ") : "free";
}
const shortModel = (id) => String(id || "").split("/").pop();
let token = null, state = null;
try { token = sessionStorage.getItem("sn-admin-token"); } catch (e) {}

function toast(msg, bad) {
  const t = $("toast"); t.textContent = msg; t.className = bad ? "err" : ""; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", bad ? 8000 : 2800);
}

async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {"Content-Type": "application/json", Authorization: `Bearer ${token}`},
                               body: body === undefined ? undefined : JSON.stringify(body)});
  if (r.status === 401) { token = null; try { sessionStorage.removeItem("sn-admin-token"); } catch (e) {} renderGate("That token was not accepted."); throw new Error("unauthorized"); }
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = {error: text}; }
  if (!r.ok) throw new Error((data && data.error) || `${r.status}`);
  return data;
}

async function act(fn, ok) {
  try { await fn(); if (ok) toast(ok); await load(); } catch (e) { if (e.message !== "unauthorized") toast(e.message, true); }
}

const TOKEN_HINT = "Use the <code>SN_ADMIN_TOKEN</code> the gateway was started with. <code>make</code> writes one to <code>.env</code>, which Docker Compose reads too.";
function renderGate(msg) {
  $("main").innerHTML = `<section class="panel gate"><div class="panel-body"><h2>Admin token</h2><p class="muted">${msg ? esc(msg) + " " : ""}${TOKEN_HINT}</p>
    <input id="tok" type="password" placeholder="Token" autocomplete="off" aria-label="Admin token"><div style="margin-top:12px"><button class="primary" id="unlock">Unlock</button></div></div></section>`;
  bindGate();
}
function bindGate() {
  const go = () => { token = $("tok").value.trim(); try { sessionStorage.setItem("sn-admin-token", token); } catch (e) {} load().catch(() => {}); };
  $("unlock").onclick = go; $("tok").onkeydown = (e) => { if (e.key === "Enter") go(); };
}

const opt = (v, label, sel) => `<option value="${esc(v)}" ${sel ? "selected" : ""}>${esc(label)}</option>`;
const STATUS = {collecting: ["Collecting", ""], queued: ["Queued", "info"], training: ["Training", "info"], shadow: ["Testing", "warn"],
  deployed: ["Live", "ok"], drifted: ["Stopped", "bad"], rejected: ["Failed test", "bad"], failed: ["Training failed", "bad"]};
function statusBadge(status, id) {
  const [label, tone] = STATUS[status] || [status, ""];
  return `<span class="badge ${tone}" ${id ? `data-status="${esc(id)}"` : ""}>${esc(label)}</span>`;
}
function field(label, input, help) { return `<label class="field">${label}${input}${help ? `<span class="help">${help}</span>` : ""}</label>`; }
function check(id, checked, label, help) { return `<label class="check"><input id="${id}" type="checkbox" ${checked ? "checked" : ""}><span>${label}${help ? `<span class="help">${help}</span>` : ""}</span></label>`; }

// ---- prompts ------------------------------------------------------------------------------------
function trainingData(p) {
  const dep = p.deployment, r = dep?.metrics?.reference_labels, h = dep?.metrics?.human, m = p.monitor;
  const used = r && (r.train || r.audit)
    ? `<b>Latest student:</b> trained with ${fmt(r.train)} known answers; ${fmt(r.audit)} kept out to test it.`
    : dep ? "<b>Latest student:</b> trained on judge labels only." : "No student trained yet.";
  return `<div class="data-box">
    <div>${used}</div>
    ${h ? `<div class="kv"><span>Right on held-out known answers</span><span>${pct(h.accuracy, 1)} of ${fmt(h.n)}</span></div>${h.judge_accuracy != null ? `<div class="kv"><span>Judge on the same answers</span><span>${pct(h.judge_accuracy, 1)}</span></div>` : ""}` : ""}
    ${m ? `<div class="kv"><span>Audit (${esc(m.phase)})</span><span>${m.agreement != null ? `${pct(m.agreement, 1)} of ${fmt(m.samples)}` : "no checks yet"} · needs ${pct(m.agreement_boundary, 1)}</span></div>` : ""}
    <p><b>Labeled examples</b> give better students and an honest test. Upload a dataset's answers with
      <code>make labels DATASET=banking77</code>: its training split trains the student instead of the judge's labels, and its test split is what the student is audited against.
      Your own files go in the store under <code>human_labels/${esc(p.id)}/</code>, one <code>{"text", "label", "split": "train" | "audit"}</code> per line.</p>
  </div>`;
}

function promptPanel(p) {
  const s = state.settings, o = p.overrides || {}, s1 = state.system_one_models, judges = state.judges;
  const dep = p.deployment;
  const baseModels = [...new Set(["jhu-clsp/ettin-encoder-17m", "jhu-clsp/ettin-encoder-32m", "jhu-clsp/ettin-encoder-150m", "microsoft/mdeberta-v3-base", ...(o.base_model ? [o.base_model] : [])])];
  return `<section class="panel" id="p-${esc(p.id)}">
    <div class="panel-head"><div><h2>${esc(p.title)}</h2><div class="muted small"><span class="mono">${esc(p.id)}</span> · ${fmt(p.labels.length)} labels · ${fmt(p.total)} requests</div></div>${statusBadge(p.status, p.id)}</div>
    <div class="panel-body prompt-grid">
      <div class="form-grid" data-pid="${esc(p.id)}">
        ${field("Answers today (System One)", `<select data-f="system_one_model">${opt("", `Default${s.default_system_one ? ` (${s.default_system_one})` : ""}`)}${s1.map((m) => opt(m.name, m.name, m.name === o.system_one_model)).join("")}</select>`)}
        ${field("Labels training data (judge)", `<select data-f="judge">${opt("", `Default${s.default_judge ? ` (${s.default_judge})` : ""}`)}${judges.map((j) => opt(j.name, j.name, j.name === o.judge)).join("")}</select>`)}
        ${field("Student base model", `<select data-f="base_model">${opt("", `Default (${shortModel(s.default_base_model)})`, !o.base_model)}${baseModels.map((m) => opt(m, m, m === o.base_model)).join("")}</select>`)}
        ${field("Requests before training", `<input data-f="threshold" type="number" min="1" placeholder="${s.default_threshold}" value="${o.threshold ?? ""}">`)}
        ${field("Target agreement", `<input data-f="target_accuracy" type="number" step="0.01" min="0.5" max="1" placeholder="${s.default_target_accuracy}" value="${o.target_accuracy ?? ""}">`, "Share of the student's confident answers that must match the reference.")}
        <label class="check"><input data-f="per_language" type="checkbox" ${o.per_language ? "checked" : ""}><span>A student per language<span class="help">Besides this prompt's student, a small one (${esc(shortModel(s.per_language.base_model))}) for each language the router is sure of in at least ${fmt(s.per_language.min_examples)} requests, from the next training.</span></span></label>
      </div>
      ${trainingData(p)}
    </div>
    <div class="panel-foot actions">
      <button class="primary" data-save-p="${esc(p.id)}">Save</button>
      <button data-train="${esc(p.id)}" title="Save, then queue a training job now">Train now</button>
      ${dep ? `<button data-audit="${esc(p.id)}" title="Test the latest student again from scratch, with the current settings. System One answers until it passes.">Re-run test</button>` : ""}
      ${dep?.active ? `<button class="danger" data-undeploy="${esc(p.id)}" title="System One answers every request again">Stop student</button>` : ""}
      <span class="muted small">Empty fields use the defaults.</span>
    </div>
  </section>`;
}

// ---- models -------------------------------------------------------------------------------------
function modelsSection() {
  const s1 = state.system_one_models, judges = state.judges;
  return `
  <section class="panel">
    <div class="panel-head"><div><h2>System One models</h2><div class="muted small">Answer requests while a prompt has no confident student.</div></div></div>
    <div class="table-wrap"><table><thead><tr><th>Name</th><th>Kind</th><th>Model</th><th class="hide-sm">Endpoint</th><th class="hide-sm">Price</th><th>Escalates to</th><th>Status</th><th></th></tr></thead><tbody>
      ${s1.length ? s1.map((m) => `<tr><td><b>${esc(m.name)}</b>${m.name === state.settings.default_system_one ? ' <span class="badge info">default</span>' : ""}</td><td>${esc(m.kind)}</td><td>${esc(m.model)}</td><td class="hide-sm mono">${esc(m.base_url)}</td><td class="hide-sm">${esc(priceText(m.pricing))}</td>

// ---- jobs ---------------------------------------------------------------------------------------
const unfinished = (j) => j.status === "queued" || j.status === "running";
const promptTitle = (id) => state.prompts.find((p) => p.id === id)?.title || id;
function jobStatus(j) {
  const [label, tone] = j.phase === "cancelled" ? ["Cancelled", ""] : {done: ["Completed", "ok"], failed: ["Failed", "bad"], running: ["Running", "info"], queued: ["Queued", ""]}[j.status] || [j.status, ""];
  return `<span class="badge ${tone}">${esc(label)}</span>${j.attempt > 1 ? `<div class="muted small">attempt ${j.attempt} of ${Math.max(j.attempt, state.settings.max_attempts)}</div>` : ""}`;
}
function jobMessage(j) {
  if (j.status === "queued" && j.not_before) return `<span class="muted">Retrying at ${esc(new Date(j.not_before).toLocaleString())}</span>`;
  if (j.status === "queued") return '<span class="muted">Waiting for a worker</span>';
  const msg = `<div class="message">${esc(j.message || "")}</div>`;
  if (j.status !== "running" || j.done == null || !(j.total > 0)) return msg;
  const f = Math.min(1, j.done / j.total);
  return `${msg}<div class="bar" style="max-width:260px;margin-top:6px" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="${j.total}" aria-valuenow="${j.done}"><i style="width:${(f * 100).toFixed(1)}%"></i></div>
    <div class="muted small">${fmt(j.done)} / ${fmt(j.total)} · ${Math.floor(f * 100)}%</div>`;
}
function jobAction(j, busy) {
  if (unfinished(j)) return `<button class="danger" data-cancel="${esc(j.id)}">Cancel</button>`;
  if (j.phase === "cancelled" && !busy.has(j.prompt_id)) return `<button data-retry="${esc(j.id)}">Retry</button>`;
  return "";
}
function when(iso) { return iso ? `<span title="${esc(iso)}">${esc(new Date(iso).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}))}</span>` : "—"; }
function jobRows(jobs) {
  if (!jobs.length) return `<tr><td colspan="6" class="empty">No training jobs yet.</td></tr>`;
  const busy = new Set(jobs.filter(unfinished).map((j) => j.prompt_id));
  return jobs.map((j) => `<tr><td>${esc(promptTitle(j.prompt_id))}<div class="muted small mono">${esc(j.id)}</div></td><td>${jobStatus(j)}</td>
    <td>${jobMessage(j)}</td><td class="hide-sm">${when(j.created_at)}</td><td class="hide-sm">${when(j.finished_at)}</td><td class="num">${jobAction(j, busy)}</td></tr>`).join("");
}

const val = (id) => $(id).value.trim();
const numOrNull = (v) => v === "" ? null : Number(v);
function overrides(pid) {
  const box = document.querySelector(`.form-grid[data-pid="${pid}"]`);
  const f = (k) => box.querySelector(`[data-f="${k}"]`).value.trim();
  return {system_one_model: f("system_one_model") || null, judge: f("judge") || null, base_model: f("base_model") || null,
          threshold: numOrNull(f("threshold")), target_accuracy: numOrNull(f("target_accuracy")),
          per_language: box.querySelector('[data-f="per_language"]').checked || null};
}

function bind() {
  $("s-calibration").onchange = () => { $("s-confidence").disabled = val("s-calibration") === "empirical"; };
  $("save-settings").onclick = () => act(async () => {
    let train;
    try { train = JSON.parse(val("s-train") || "{}"); } catch (e) { throw new Error("Training settings must be valid JSON"); }
    const r = await api("PUT", "/admin/api/settings", {
      default_threshold: Number(val("s-threshold")), default_system_one: val("s-s1") || null, default_judge: val("s-judge") || null,
      default_base_model: val("s-base"), default_target_accuracy: Number(val("s-target")), log_inputs: $("s-log").checked, train,
      calibration: {method: val("s-calibration"), confidence_level: Number(val("s-confidence")) / 100},
      max_attempts: Number(val("s-attempts")), retry_secs: Number(val("s-retry")), retry_max_secs: Number(val("s-retry-max")),
      per_language: {min_confidence: Number(val("s-pl-confidence")), min_examples: Number(val("s-pl-examples")), base_model: val("s-pl-model")},
      cache: {enabled: $("s-cache").checked, position: val("s-cache-position"), policy: val("s-cache-policy"),
              capacity: Number(val("s-cache-capacity")), ttl_secs: Number(val("s-cache-ttl") || 0)},
      monitor: {enabled: $("s-monitor").checked, sample_rate: Number(val("s-audit-rate")), uncertain_sample_rate: Number(val("s-audit-uncertain")), inconclusive_margin: Number(val("s-audit-margin")), window: Number(val("s-audit-window")), min_samples: Number(val("s-audit-min")), tolerance: Number(val("s-audit-tolerance"))}});
    if (r.queued) toast(`Saved; ${r.queued} prompt(s) queued for training`);
  }, "Defaults saved");
  $("clear-cache").onclick = () => act(() => api("DELETE", "/admin/api/cache"), "Cache emptied");
  $("save-s1").onclick = () => act(async () => {
    if (!val("m-name")) throw new Error("Give the model a name");

      kind: val("m-kind"), base_url: val("m-url"), model: val("m-model"), api_key_env: val("m-key") || null,

  });
  document.querySelectorAll("[data-del-s1]").forEach((b) => b.onclick = () => act(() => api("DELETE", `/admin/api/system-one-models/${encodeURIComponent(b.dataset.delS1)}`), "Deleted"));
  document.querySelectorAll("[data-del-j]").forEach((b) => b.onclick = () => act(() => api("DELETE", `/admin/api/judges/${encodeURIComponent(b.dataset.delJ)}`), "Deleted"));
  document.querySelectorAll("[data-save-p]").forEach((b) => b.onclick = () => act(async () => {
    const r = await api("PUT", `/admin/api/prompts/${b.dataset.saveP}`, overrides(b.dataset.saveP));
    if (r.queued) toast("Saved; the prompt is now queued for training");
  }, "Prompt saved"));
  document.querySelectorAll("[data-train]").forEach((b) => b.onclick = () => act(async () => {
    const r = await api("PUT", `/admin/api/prompts/${b.dataset.train}`, overrides(b.dataset.train));
    if (!r.queued) await api("POST", `/admin/api/prompts/${b.dataset.train}/train`);
  }, "Training job queued"));
  document.querySelectorAll("[data-undeploy]").forEach((b) => b.onclick = () => act(() => api("POST", `/admin/api/prompts/${b.dataset.undeploy}/undeploy`), "Student stopped; System One answers every request"));
  document.querySelectorAll("[data-audit]").forEach((b) => b.onclick = () => act(() => api("POST", `/admin/api/prompts/${b.dataset.audit}/audit`), "Test restarted; System One answers until the student passes"));
  bindJobs();
}
function bindJobs() {
  document.querySelectorAll("[data-cancel]").forEach((b) => b.onclick = () => act(() => api("POST", `/admin/api/jobs/${b.dataset.cancel}/cancel`), "Job cancelled"));
  document.querySelectorAll("[data-retry]").forEach((b) => b.onclick = () => act(() => api("POST", `/admin/api/jobs/${b.dataset.retry}/retry`), "Training job queued again"));
}

async function load() { state = await api("GET", "/admin/api/state"); render(); watch(); }

// While anything moves (a job, a test), refresh the jobs table and the prompts' badges every few
// seconds. The forms are left alone, so nothing typed is lost.
let timer = null;
function watch() {
  clearTimeout(timer);
  const moving = state.jobs.some(unfinished) || state.prompts.some((p) => p.status === "shadow");
  if (moving) timer = setTimeout(refreshLive, 3000);
}
async function refreshLive() {
  let fresh;
  try { fresh = await api("GET", "/admin/api/state"); } catch (e) { if (e.message !== "unauthorized") watch(); return; }
  if (!$("jobs-body")) return;
  state.jobs = fresh.jobs;
  $("jobs-body").innerHTML = jobRows(state.jobs);
  bindJobs();
  fresh.prompts.forEach((p) => { const el = document.querySelector(`[data-status="${p.id}"]`); if (el) el.outerHTML = statusBadge(p.status, p.id); });
  state.prompts = state.prompts.map((p) => ({...p, status: fresh.prompts.find((q) => q.id === p.id)?.status ?? p.status}));
  watch();
}

if (token) load().catch(() => {}); else bindGate();
</script>
</body>
</html>
